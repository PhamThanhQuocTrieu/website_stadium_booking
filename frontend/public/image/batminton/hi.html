║    3. Thêm rule vào AUTO_RULES (nếu muốn tự động)       ║
║                                                          ║
║  Preview: thêm ?splash=<tên> vào URL để test           ║
╚══════════════════════════════════════════════════════════╝

<script>
  var SPLASH_THEME = 'auto'; // ← ĐỔI Ở ĐÂY
</script>

<script id="splash-loader">
  (function () {
    // ─ Ngày đặc biệt ― thêm rule tại đây
    var AUTO_RULES = [
      { month: 4, day: 29, theme: 'vn304' },
      { month: 4, day: 30, theme: 'vn304' },
      { month: 5, day: 1, theme: 'vn304' },
      { month: 4, day: 25, theme: 'hung-vuong' },
      { month: 4, day: 26, theme: 'hung-vuong' },
      { month: 4, day: 27, theme: 'hung-vuong' },
    ];

    function autoTheme() {
      var d = new Date();
      for (var i = 0; i < AUTO_RULES.length; i++) {
        var r = AUTO_RULES[i];
        if (d.getMonth() + 1 === r.month && d.getDate() === r.day) return r.theme;
      }
      return 'sports';
    }

    var forced = new URLSearchParams(location.search).get('splash');
    var theme  = forced
      || (typeof SPLASH_THEME !== 'undefined' && SPLASH_THEME !== 'auto'
          ? SPLASH_THEME
          : autoTheme());

    window._splashTheme = theme;

    // 1. Load CSS
    var link = document.createElement('link');
    link.rel  = 'stylesheet';
    link.type = 'text/css';
    link.href = 'splash/themes/' + theme + '.css';
    document.head.appendChild(link);

    // 2. Load HTML và inject vào đầu <body>
    fetch('splash/themes/' + theme + '.html')
      .then(function (r) { return r.text(); })
      .then(function (html) {
        document.body.insertAdjacentHTML('afterbegin', html);
      })
      .catch(function () {
        console.warn('[Splash] Không tìm thấy theme:', theme);
      });
  })();
</script>

<script id="splash-screen-script">
  var _splashStartTime = Date.now();
  var _SPLASH_MIN_MS = (window._splashTheme && window._splashTheme !== 'sports') ? 5000 : 1000;

  function removeSplashFromWeb() {
    var el = document.querySelector('[data-splash-root]');
    if (!el) return;
    var elapsed = Date.now() - _splashStartTime;
    var delay = Math.max(0, _SPLASH_MIN_MS - elapsed);
    setTimeout(function () {
      el.classList.add('sp-fade-out');
      setTimeout(function () { el.remove(); }, 600);
      document.body.style.background = 'transparent';
    }, delay);
  }
</script>
